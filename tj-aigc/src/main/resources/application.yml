server:
  port: 8096  #端口
  tomcat:
    uri-encoding: UTF-8   #服务编码
  error:
    include-message: always #返回的响应体带上message
spring:
  profiles:
    active: local
  application:
    name: aigc-service
tj:
  swagger:
    enable: true
    enableResponseWrap: true
    package-path: com.tianji.exam.controller
    title: 天机学堂 - 考试中心接口文档
    description: 该服务提供题目管理、考试管理、数据统计等功能
    contact-name: 传智教育·研究院
    contact-url: http://www.itcast.cn/
    contact-email: zhanghuyi@itcast.cn
    version: v1.0
  jdbc:
    database: tj_aigc
  auth:
    resource:
      enable: false
  ai:
    prompt:
      system:
        chat:
          data-id: system-chat-message.txt
          group: DEFAULT_GROUP
          timeout-ms: 20000
        route-agent:
          data-id: route-agent-system-message.txt
        recommend-agent:
          data-id: recommend-agent-system-message.txt
        buy-agent:
          data-id: buy-agent-system-message.txt
        knowledge-agent:
          data-id: knowledge-agent-system-message.txt
        consult-agent:
          data-id: consult-agent-system-message.txt
        text:
          data-id: text-system-chat-message.txt
    memory:
      max: 100 #存储最大的聊天记录数
      type: Redis
    chat-type: ROUTE # ROUTE / ENHANCE / APP
