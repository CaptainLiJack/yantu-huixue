server:
  port: 8087  #端口
  tomcat:
    uri-encoding: UTF-8   #服务编码
  error:
    include-message: always #返回的响应体带上message
spring:
  profiles:
    active: local
  application:
    name: pay-service
tj:
  swagger:
    enable: true
    enableResponseWrap: true
    package-path: com.tianji.pay.controller
    title: 天机学堂 - 支付中心接口文档
    description: 该服务提供微信、支付宝等各种平台的支付、退款等功能
    contact-name: 传智教育·研究院
    contact-url: http://www.itcast.cn/
    contact-email: zhanghuyi@itcast.cn
    version: v1.0
  jdbc:
    database: tj_pay
  pay:
    # 支付回调地址，由部署环境提供
    notifyHost: ${tj.pay.notify-host:}
    ali:
      # 支付宝应用与密钥，从环境变量或配置中心注入，切勿提交到仓库
      appId: ${tj.pay.ali.app-id:}
      merchantPrivateKey: ${tj.pay.ali.merchant-private-key:}
      publicKey: ${tj.pay.ali.public-key:}
    wx:
      # 微信支付商户信息与密钥，从环境变量或配置中心注入，切勿提交到仓库
      appId: ${tj.pay.wx.app-id:}
      mchId: ${tj.pay.wx.mch-id:}
      mchSerialNo: ${tj.pay.wx.mch-serial-no:}
      privateKey: ${tj.pay.wx.private-key:}
      apiV3Key: ${tj.pay.wx.api-v3-key:}
